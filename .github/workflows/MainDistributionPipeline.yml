#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  # Pushes build only on main. A push to a PR branch fires a push run AND a
  # pull_request run for the same commit, so every ungated job here built twice
  # per push: 7 duplicate jobs, 2 of them hosted macOS legs, measured on
  # f3729dfa (push run 39165845984 and pull_request run 39165849843, same sha).
  # The pull_request run is the one whose status matters. What the filter costs:
  # a branch with no PR open gets no CI until the PR opens. Nothing here deploys
  # on tags, and workflow_dispatch still runs on any branch.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # github.event_name is part of the key on purpose. Without it a push to a
  # branch and a workflow_dispatch on that same branch collide: same ref, same
  # sha, both with empty head_ref/base_ref. cancel-in-progress then kills the
  # push run every time the canary is dispatched by hand, and a cancelled run
  # reads as a failed one on the checks dashboard.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  # Next-line build against the v2.0 release branch the registry ships against,
  # and the gate that tells us a release PR will build + test on the 2.0 line.
  #
  # RESOLVE THE STAGED VERSION FIRST (issue #71, fleet pattern — see scalarfs /
  # duck_tails). ci-tools fetches a PREBUILT libduckdb from duckdb-staging, which
  # reports a concrete version (e.g. v2.0.1-alphaN). Passing the branch NAME
  # "v2.0-cyanoptera" as duckdb_version stamps that string into the extension, so
  # the loader refuses the prebuilt lib ("built specifically for DuckDB version
  # 'v2.0-cyanoptera'") and `require plinking_duck` FAILS every test in a retried
  # batch. Resolving the staged version + commit and passing BOTH makes the stamp
  # match the prebuilt, so the leg runs on PRs and stays GREEN — a usable PR gate
  # rather than drift noise. (The advisory `main` canary below stays off PRs.)
  duckdb-next-ref:
    name: Next-line build — resolve DuckDB v2.0
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      # WALK BACK FROM THE TIP to the newest commit that duckdb-staging actually
      # built. Resolving the tip alone is what this job used to do, and it is red
      # whenever staging lags -- measured 2026-10-26: of the 8 newest cyanoptera
      # commits, only 2 had a staged build, and the tip was not one of them:
      #
      #   af2d380a19  404      <- tip
      #   99b013ad36  404
      #   c4d7b8bd7e  200  v2.0.1-alpha50398
      #   defed5fd79  404
      #   3ea22a8bc3  404
      #   bb5bdadda4  200  v2.0.1-alpha50125
      #
      # So the premise "the tip has a staged build" is false most of the time. The
      # walk keeps what the resolver was for -- no manual bump, and a version that
      # matches the prebuilt libduckdb the build will download -- while taking the
      # newest commit that can actually be built. It still fails loudly when NO
      # commit in range is staged, which is a real staging outage rather than lag.
      # Teague ruled the SHAPE (walk back to the newest staged commit). The CAP is
      # mine, and unlike the two invented values before it (25, then the
      # coordinator's 50) this one is measured.
      #
      # Staging does not keep a trailing window of recent builds; it builds SOME
      # commits and skips runs of others. Probing the newest 60 commits found only
      # 2 staged, with a run of 54 CONSECUTIVE unstaged commits spanning just 0.8
      # days -- while a staged build 3.1 days old was still being served. Age does
      # not explain it, so a burst of commits can get one build for the whole burst.
      #
      # That makes the run length the thing the cap must clear, and 50 does not
      # clear it: on 2026-10-23 around 10:13, when 420d03f67 was the tip, a walk of
      # depth 50 would have found nothing and failed. 150 gives roughly 3x the
      # worst run measured. It costs nothing in the normal case, because the loop
      # breaks at the first staged commit -- today the 3rd probe.
      - id: resolve
        shell: bash
        run: |
          set -euo pipefail
          DEPTH=150
          tip=$(git ls-remote https://github.com/duckdb/duckdb.git refs/heads/v2.0-cyanoptera | cut -f1)
          [ -n "$tip" ] || { echo "::error::could not resolve duckdb v2.0-cyanoptera"; exit 1; }

          tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
          git clone --quiet --filter=blob:none --no-checkout --depth "$DEPTH" \
              --branch v2.0-cyanoptera https://github.com/duckdb/duckdb.git "$tmp/duckdb"

          commit=""; version=""; behind=0
          for sha in $(git -C "$tmp/duckdb" log --format=%H -n "$DEPTH"); do
            v=$(curl -sSfL "https://duckdb-staging.duckdb.org/${sha:0:10}/latest_alpha_version.txt" 2>/dev/null | tr -d '[:space:]') || { behind=$((behind+1)); continue; }
            if [[ "$v" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|rc|dev)[0-9]+)?$ ]]; then
              commit="$sha"; version="$v"; break
            fi
            behind=$((behind+1))
          done

          if [ -z "$commit" ]; then
            echo "::error::no staged DuckDB build for v2.0-cyanoptera in its last $DEPTH commits (tip $tip)"
            exit 1
          fi

          echo "v2.0-cyanoptera tip is $tip"
          echo "resolved $commit, version $version ($behind commit(s) behind the tip)"
          if [ "$behind" -gt 0 ]; then
            echo "::notice::the v2.0-cyanoptera tip ($tip) has no staged build; using $commit ($version), $behind commit(s) back"
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  duckdb-next-build:
    name: Next-line build — DuckDB v2.0 (cyanoptera)
    needs: duckdb-next-ref
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      duckdb_version: ${{ needs.duckdb-next-ref.outputs.version }}
      duckdb_commit: ${{ needs.duckdb-next-ref.outputs.commit }}
      ci_tools_version: main
      extension_name: plinking_duck
      # Same plink-ng portability exclusions as the stable leg below -- they are
      # plink-ng source issues, independent of the DuckDB version.
      exclude_archs: 'linux_amd64_musl;windows_amd64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads'

      # Make a skipped test run FAIL on this leg. `--require plinking_duck` turns
      # "could not load" into `require plinking_duck: FAILED` instead of a silent
      # skip (the `T` test pattern reaches `make test_release` via ci_phase.py).
      test_config: '{"test_env_variables": {"T": "--test-flags \"--require plinking_duck\" \"test/*\""}}'
  # RESOLVE main TO A (commit, version) PAIR. `duckdb_version: main` reached the
  # build as DUCKDB_VERSION=main, and duckdb main's CMakeLists.txt reads that env var
  # as its explicit version, so the library reports 'vmain' while the extension is
  # stamped 'main'. The loader refuses that pair and every test SKIPS at its require
  # line while the leg reports success. Measured HERE on 112c317 (run 40972741397):
  #
  #   -- git hash ed0443f18a, version main, extension folder main
  #   0 passed, 95 skipped in 1s        <- linux_amd64 AND osx_arm64, conclusion success
  #
  # The version is computed the way duckdb's own CMake does for a dev build:
  # v<scripts/ci/release_version.txt>.0-dev<git rev-list --count HEAD>. The `-dev`
  # suffix does two jobs: it stops the engine treating the string as a release (what
  # 'vmain' could not do), and it keeps the string inside ci_phase.py's
  # STAGED_DUCKDB_VERSION_PATTERN, so no staged version is ever substituted behind it.
  # Staging has no prebuilt for a main commit, so ci-tools builds from source.
  #
  # Unlike `duckdb-next-ref` above, this resolver does NOT walk back: it does not need
  # a staged build, so the tip always works.
  #
  # `--filter=tree:0` is deliberate and is NOT `blob:none`: `rev-list --count` needs
  # the whole commit history, only its trees are skippable.
  #
  # Canonical text: duckdb_scalarfs at 6271b22, now proven on seven sibling repos.
  duckdb-main-ref:
    name: Canary build — resolve DuckDB main
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
          # Commits only: rev-list --count needs the whole history, not its trees.
          git clone --quiet --filter=tree:0 --no-checkout --single-branch --branch main \
              https://github.com/duckdb/duckdb.git "$tmp/duckdb"
          commit=$(git -C "$tmp/duckdb" rev-parse HEAD)
          release=$(git -C "$tmp/duckdb" show HEAD:scripts/ci/release_version.txt | tr -d '[:space:]')
          count=$(git -C "$tmp/duckdb" rev-list --count HEAD)
          version="v${release}.0-dev${count}"
          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.0-dev[0-9]+$ ]]; then
            echo "::error::could not build a dev version for duckdb main at $commit (got '$version')"
            exit 1
          fi
          echo "duckdb main -> $commit, version $version"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # ADVISORY canary on DuckDB `main`, the line beyond 2.0. Pushes to main and
  # dispatch only, never pull requests: a PR rollup would go red for a line
  # nothing ships against. `main` moves under the cyanoptera gate above, so a red
  # here is a warning about upstream churn, not necessarily a bug in the change.
  # A red canary after this change is a REAL FINDING, not a reason to revert it.
  duckdb-main-canary:
    name: Canary — build against DuckDB main (advisory)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: duckdb-main-ref
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      duckdb_version: ${{ needs.duckdb-main-ref.outputs.version }}
      duckdb_commit: ${{ needs.duckdb-main-ref.outputs.commit }}
      ci_tools_version: main
      extension_name: plinking_duck
      # Same plink-ng portability exclusions as the stable leg below -- they are
      # plink-ng source issues, independent of the DuckDB version.
      exclude_archs: 'linux_amd64_musl;windows_amd64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads'

      # THE GUARD. Fixing the version is only half of it: without
      # `--require plinking_duck` a load failure stays a silent skip that reports
      # success, which is exactly how `0 passed, 95 skipped` survived on this leg.
      # With the guard the same condition reads `require plinking_duck: FAILED`.
      # The token is the literal this repo's own tests use, measured with
      # `grep -rhoE '^require [a-z_]+' test/ | sort -u` (which gives `parquet` and
      # `plinking_duck`), never derived from EXT_NAME.
      test_config: '{"test_env_variables": {"T": "--test-flags \"--require plinking_duck\" \"test/*\""}}'

  # THE SHIPPING LINE, promoted from v1.5.6 to v2.0.0 (2026-10-26). The commit is
  # upstream's v2.0.0 release TAG, measured today:
  #   git ls-remote --tags https://github.com/duckdb/duckdb.git v2.0.0
  #     -> d54cbbe3df17e8e5ce68312f483b4155836112aa
  #
  # duckdb_version is a RELEASE TAG and never a branch name. ci_phase.py checks
  # this value against a semver pattern; a branch name such as `v2.0-cyanoptera`
  # fails that check, so the script resolves the branch's staged version for the
  # download URL only and never writes it back. CMake then stamps the extension
  # with the branch name while the library it links reports the staged version,
  # DuckDB refuses a stamp that differs from its own version, and every test fails
  # at its `require` line (measured on three sibling repos, 2026-10-25). A release
  # tag matches the pattern, so nothing is substituted, and duckdb_commit selects
  # the checkout.
  #
  # The `uses:` ref and ci_tools_version are the extension-ci-tools BRANCH
  # v2.0-cyanoptera, which is unrelated to the DuckDB branch of the same name.
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: v2.0.0
      duckdb_commit: d54cbbe3df17e8e5ce68312f483b4155836112aa
      ci_tools_version: v2.0-cyanoptera
      extension_name: plinking_duck
      # plink-ng portability issues (not ours), independent of the DuckDB version:
      #   musl: SIMD segfault at runtime
      #   Windows MSVC: can't compile libdeflate (__attribute__ syntax)
      #   Windows MinGW: disabled pending further investigation
      #   Wasm: plink-ng requires POSIX APIs (pthreads, file I/O)
      # Windows stays excluded: the libdeflate/MSVC blocker is a plink-ng source issue,
      # not something a DuckDB/ci-tools bump can resolve.
      exclude_archs: 'linux_amd64_musl;windows_amd64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads'

      # THE GUARD BELONGS ON THE SHIPPING LEG, which is the point of the promote.
      # Without it an extension that fails to load yields `ran tests: 0 passed,
      # N skipped` and the leg still reports SUCCESS -- measured on duckdb_webbed's
      # unguarded canary (0 passed, 130 skipped, conclusion success, 2026-10-25).
      # `--require plinking_duck` turns "could not load" into
      # `require plinking_duck: FAILED`. The token is the literal this repo's own
      # tests use, measured with `grep -rhoE '^require [a-z_]+' test/ | sort -u`
      # (which gives `parquet` and `plinking_duck`), never derived from EXT_NAME.
      test_config: '{"test_env_variables": {"T": "--test-flags \"--require plinking_duck\" \"test/*\""}}'

  # FORMAT only via the upstream reusable workflow. Tidy is split out into the
  # local job below because the reusable tidy job installs only ninja-build +
  # clang-tidy + pybind11 and provides no Eigen3 / vcpkg, so `make tidy-check`'s
  # cmake configure died with "Eigen3 not found" (plinking's hard #53 requirement)
  # before clang-tidy ever ran. The reusable workflow's extra_toolchains input is
  # not consumed by its tidy job, and that workflow is not ours to edit — hence a
  # local mirror.
  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v2.0-cyanoptera
    with:
      # duckdb_version is DEPRECATED on this workflow and is ignored for format
      # purposes -- upstream states it outright: "code quality checks use the
      # checked-out duckdb submodule". It is the SUBMODULE BUMP below that changes
      # the formatter, which is why a promote reddens files no commit touched.
      duckdb_version: v2.0.0
      ci_tools_version: v2.0-cyanoptera
      extension_name: plinking_duck
      format_checks: 'format'

  # LOCAL tidy job: mirrors the reusable _extension_code_quality tidy job's steps
  # (checkout + submodules, extension-ci-tools@v1.5-variegata, make tidy-check)
  # but ALSO apt-installs libeigen3-dev so the configure satisfies
  # find_package(Eigen3) (CMakeLists falls back to the system headers under
  # /usr/include/eigen3). The extension-ci-tools tidy-check selects TUs with the
  # regex 'src/.*/', whose trailing slash needs a subdirectory of src/; plinking's
  # sources are flat, so that regex matched zero files and the gate linted nothing.
  # The repo Makefile now OVERRIDES tidy-check with a flat-source regex, a
  # plinking-anchored header filter, -std=c++17, and a guard that fails if zero
  # TUs are selected. .clang-tidy is a real, owned file (no longer the duckdb
  # symlink) whose WarningsAsErrors blocks a high-value subset and leaves the
  # plink2 integer idioms advisory. So this lints all 21 sources for real.
  tidy-check:
    name: Tidy Check
    runs-on: ubuntu-24.04
    env:
      CC: gcc
      CXX: g++
      GEN: ninja
      TIDY_THREADS: 4
    steps:
      - uses: actions/checkout@v4
        name: Checkout current repository
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - uses: actions/checkout@v4
        name: Checkout Extension CI tools
        with:
          path: 'extension-ci-tools'
          ref: 'v1.5-variegata'
          repository: 'duckdb/extension-ci-tools'

      - name: Install
        shell: bash
        run: sudo apt-get update -y -qq && sudo apt-get install -y -qq ninja-build clang-tidy libeigen3-dev && sudo pip3 install pybind11[global] --break-system-packages

      - name: Tidy Check Diff
        shell: bash
        run: make tidy-check
